<div class="container-fluid px-3 px-md-4">
    <header class="mb-4 d-flex flex-wrap justify-content-between align-items-center gap-3">
        <div><h1 class="mb-1">DMN bewerken</h1><span class="text-body-secondary small">Versie {{ dmnVersion }}</span></div>
        <button (click)="saveDiagram()" type="button" class="btn btn-primary">Opslaan</button>
    </header>
    <div class="row g-3">
        <div class="col-12 col-lg-9 min-width-0">
            <nav class="editor-tabs nav nav-pills flex-nowrap gap-1 overflow-x-auto p-1 mb-3" aria-label="Diagramweergaven">
                @for(view of views; track view; let idx = $index) {
                    <button type="button" class="nav-link flex-shrink-0" [class.active]="idx === activeViewIdx" [attr.aria-pressed]="idx === activeViewIdx" (click)="openView(idx)">
                        <span class="{{ checkClass(view.type) }}" aria-hidden="true"></span>
                        {{ view.element.name || view.element.id }}
                    </button>
                }
            </nav>
            <div class="dmn-container"><div #dmnModelerRef id="dmn-canvas"></div></div>
        </div>
        <aside class="col-12 col-lg-3 min-width-0" aria-label="Diagrameigenschappen">
            <h2 class="properties-heading d-flex align-items-center mb-3">Eigenschappen</h2>
            <div id="dmn-properties-panel"></div>
        </aside>
    </div>
</div>
