<div class="container">
    <header class="mb-4">
        <h1>DMN indienen voor review</h1>
        <p class="text-body-secondary mt-2 mb-0">Beschrijf uw wijzigingen en selecteer een controleur.</p>
    </header>
    <div class="card form-panel">
        <div class="card-body p-3 p-md-4">
            <form [formGroup]="myForm">
                <div class="alert alert-warning mb-4" role="alert"><strong>Controleer uw diagram.</strong> Na het indienen kan deze niet meer aangepast worden.</div>
                <div class="mb-4">
                    <label class="form-label small fw-semibold" for="inputDescription">Beschrijving van de wijzigingen</label>
                    <textarea formControlName="description" class="form-control" id="inputDescription" placeholder="Beschrijf wijzigingen" rows="5"></textarea>
                </div>
                <div class="mb-4">
                    <label class="form-label small fw-semibold" for="form_new_dmn_owner">Controleur DMN</label>
                    <select class="form-select" id="form_new_dmn_owner" formControlName="reviewer" required>
                        <option value="" disabled selected>Kies een controleur</option>
                        @for(review of possibleReviewers; track review.id) {
                            <option value="{{ review.username }}">{{ review.firstName || review.lastName ? (review.firstName || '') + ' ' + (review.lastName || '') : review.username }}</option>
                        }
                    </select>
                </div>
                <div class="border-top pt-4"><button (click)="handInChanges()" class="btn btn-primary">Indienen</button></div>
            </form>
        </div>
    </div>
</div>
