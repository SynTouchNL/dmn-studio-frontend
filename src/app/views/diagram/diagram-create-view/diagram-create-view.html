<div class="container">
    <header class="mb-4">
        <h1>Nieuwe DMN versie aanmaken</h1>
        <p class="text-body-secondary mt-2 mb-0">Kies hoe u de nieuwe versie wilt starten.</p>
    </header>
    <div class="card form-panel">
        <div class="card-body p-3 p-md-4">
            <div class="mb-4">
                <label for="reuseDmn" class="form-label small fw-semibold">Wilt u de huidige versie van de DMN hergebruiken?</label>
                <select id="reuseDmn" class="form-select" [(ngModel)]="reuseDmn" name="reuseDmn" required>
                    <option [ngValue]="0" disabled>Selecteer een optie</option>
                    <option [ngValue]="1">Ja</option>
                    <option [ngValue]="2">Nee, nieuwe DMN</option>
                    <option [ngValue]="3">Nee, importeer een DMN</option>
                </select>
            </div>
            @if(reuseDmn === 3) {
                <div class="mb-4">
                    <label for="formFile" class="form-label small fw-semibold">Importeer DMN bestand</label>
                    <input class="form-control" type="file" id="formFile" (change)="onFileChange($event)" required>
                </div>
            }
            <div class="border-top pt-4"><button (click)="createNewVersion()" class="btn btn-primary">Aanmaken</button></div>
        </div>
    </div>
</div>
