<div class="container">
    <header class="mb-4">
        <h1>Nieuwe DMN aanmaken</h1>
        <p class="text-body-secondary mt-2 mb-0">Geef uw beslismodel een naam en wijs een domein en eigenaar toe.</p>
    </header>
    <div class="card form-panel">
        <div class="card-body p-3 p-md-4">
            <form>
                <div class="mb-4">
                    <label class="form-label small fw-semibold" for="form_new_dmn_name">Naam DMN</label>
                    <input required type="text" class="form-control" id="form_new_dmn_name" placeholder="Kies een DMN naam" [(ngModel)]="dmnName" name="dmnName">
                </div>
                <div class="mb-4">
                    <label class="form-label small fw-semibold" for="form_new_dmn_domain">Domein</label>
                    <select class="form-select" id="form_new_dmn_domain" [(ngModel)]="dmnDomain" name="dmnDomain" required>
                        <option value="" disabled selected>Kies uw domein</option>
                        @for(domain of domains; track domain.id) { <option value="{{ domain.id }}">{{ domain.name }}</option> }
                    </select>
                </div>
                <div class="mb-4">
                    <app-typeahead-users-partial [title]="'Eigenaar DMN'" [data]="dmnUsers" (selected)="onUserPicked($event)"></app-typeahead-users-partial>
                </div>
                <div class="mb-4">
                    <label for="formFile" class="form-label small fw-semibold">Importeer een DMN diagram <span class="fw-normal text-body-secondary">(optioneel)</span></label>
                    <input class="form-control" type="file" name="dmnFile" id="formFile" (change)="onFileChange($event)">
                </div>
                <div class="d-flex flex-wrap align-items-center gap-2 border-top pt-4">
                    <button (click)="submitForm($event)" class="btn btn-primary">Indienen</button>
                    <button [routerLink]="['/dmns']" class="btn btn-outline-secondary">Terug</button>
                </div>
            </form>
        </div>
    </div>
</div>
