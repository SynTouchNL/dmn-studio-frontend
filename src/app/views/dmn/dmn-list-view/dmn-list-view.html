<div class="container">
    <header class="mb-4 d-flex flex-wrap justify-content-between align-items-start gap-3">
        <div>
            @if(this.domain_selected == '') { <h1>DMNs</h1> }
            @else { <h1>DMNs · {{ this.domain_selected.name }}</h1> }
            <p class="text-body-secondary mt-2 mb-0">Beheer uw beslismodellen, versies en beoordelingen.</p>
        </div>
        <button [routerLink]="['/dmns/new']" class="btn btn-primary" type="button"><i class="fa-solid fa-plus me-2" aria-hidden="true"></i>Nieuwe DMN</button>
    </header>
    <div class="row g-3 mb-4 align-items-end">
        <div class="col-12 col-md-4 col-lg-3">
            <form [formGroup]="myForm">
                <label class="form-label small fw-semibold" for="domain-filter">Domein</label>
                <select id="domain-filter" [formControlName]='"domain"' class="form-select">
                    <option [ngValue]="null" selected>Alle domeinen</option>
                    @for(domain of domains; track domain.id + " - " + domain.name) { <option [ngValue]="domain">{{ domain.name }}</option> }
                </select>
            </form>
        </div>
        <div class="col-12 col-md-5 col-lg-4 ms-md-auto">
            <form [formGroup]="myForm">
                <label class="form-label small fw-semibold" for="dmn-search">Zoeken</label>
                <div class="input-group">
                    <input id="dmn-search" formControlName="search" class="form-control" type="text" placeholder="Zoek een DMN..." />
                    <button class="btn btn-outline-secondary" type="button" aria-label="DMNs zoeken"><i class="fas fa-search" aria-hidden="true"></i></button>
                </div>
            </form>
        </div>
    </div>
    <app-dmn-list-partial [showDropdown]="true" [dmnList]="dmnData" [domains]="true"></app-dmn-list-partial>
</div>
