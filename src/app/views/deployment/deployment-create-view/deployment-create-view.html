<div class="container">
    <header class="mb-4"><h1>Deployment aanmaken</h1><p class="text-body-secondary mt-2 mb-0">Selecteer het beslismodel en de omgeving voor deze deployment.</p></header>
    <div class="card form-panel"><div class="card-body p-3 p-md-4">
        <form [formGroup]="myForm" (submit)="onSubmit($event)">
            <label class="form-label small fw-semibold" for="domainSelector">Domein</label>
            <select id="domainSelector" formControlName="domains" class="form-select mb-4" required>
                <option value="" disabled selected>Kies een Domein</option>
                @for(dom of domains; track dom.id) {
                    <option [ngValue]="dom" value="{{ dom.id }}">{{ dom.name }}</option>
                }
            </select>

            <label class="form-label small fw-semibold" for="dmnSelector">DMN</label>
            <select id="dmnSelector" formControlName="dmns" class="form-select mb-4" required>
                <option value="" disabled selected>Kies een DMN</option>
                @for(dmn of dmns; track dmn.id) {
                    <option [ngValue]="dmn" value="{{ dmn.id }}">{{ dmn.name }}</option>
                }
            </select>

            <label class="form-label small fw-semibold" for="versionSelector">Versie</label>
            <select id="versionSelector" formControlName="versions" class="form-select mb-4" required>
                <option value="" disabled selected>Kies een versie</option>
                @for(ver of dmn_versions; track ver.id + ver.version) {
                    <option [ngValue]="ver" value="{{ ver.id }}">v{{ ver.version }} - {{ ver.status | statusPipe }}</option>
                }
            </select>

            <label class="form-label small fw-semibold" for="environmentSelector">Omgeving</label>
            <select id="environmentSelector" formControlName="environments" class="form-select mb-4" required>
                <option value="" disabled selected>Kies een omgeving</option>
                @for(env of environments; track env.id) {
                    <option [ngValue]="env" value="{{ env.id }}">{{ env.name }}</option>
                }
            </select>
            <div class="alert alert-warning" role="alert">
                Controleer de DMN versie en omgeving voordat u op <strong>Uitrollen</strong> klikt.
            </div>
            <div class="border-top pt-4">
                <button class="btn btn-primary" type="submit" [disabled]="button_disabled || clicked">
                    @if(!clicked){
                        Uitrollen
                    } @else {
                        <span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span>
                        <span class="ms-2">  Uitrollen</span>
                    }
                </button>
            </div>
        </form>
    </div></div>
</div>
